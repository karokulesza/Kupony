databaseChangeLog:
  - changeSet:
      id: 001-active-coupons
      author: kupony
      changes:
        - createTable:
            tableName: active_coupons
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_active_coupons } }
              - column: { name: code, type: varchar(32), constraints: { nullable: false } }
              - column: { name: normalized_code, type: varchar(32), constraints: { nullable: false } }
              - column: { name: active_code, type: varchar(32) }
              - column: { name: country, type: varchar(2), constraints: { nullable: false } }
              - column: { name: max_uses, type: int, constraints: { nullable: false } }
              - column: { name: used_count, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: exhausted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: active_coupons
            columnNames: active_code
            constraintName: ux_active_coupons_active_code
        - createIndex:
            tableName: active_coupons
            indexName: ix_active_coupons_normalized_code
            columns:
              - column: { name: normalized_code }
        - sql:
            sql: >
              ALTER TABLE active_coupons ADD CONSTRAINT ck_active_coupons_max_uses
              CHECK (max_uses >= 1)
        - sql:
            sql: >
              ALTER TABLE active_coupons ADD CONSTRAINT ck_active_coupons_used_count
              CHECK (used_count >= 0 AND used_count <= max_uses)

  - changeSet:
      id: 001-coupon-redemptions
      author: kupony
      changes:
        - createTable:
            tableName: coupon_redemptions
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_coupon_redemptions } }
              - column: { name: coupon_id, type: uuid, constraints: { nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: ip, type: varchar(45), constraints: { nullable: false } }
              - column: { name: country, type: varchar(2), constraints: { nullable: false } }
              - column: { name: redeemed_at, type: timestamp with time zone, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: coupon_redemptions
            baseColumnNames: coupon_id
            referencedTableName: active_coupons
            referencedColumnNames: id
            constraintName: fk_coupon_redemptions_coupon
            onDelete: RESTRICT
        - addUniqueConstraint:
            tableName: coupon_redemptions
            columnNames: coupon_id, user_id
            constraintName: ux_coupon_redemptions_coupon_user

  - changeSet:
      id: 001-archival-task
      author: kupony
      changes:
        - createTable:
            tableName: archival_task
            columns:
              - column: { name: coupon_id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_archival_task } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: lease_until, type: timestamp with time zone }
              - column: { name: attempts, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: last_error, type: varchar(1000) }
        - createIndex:
            tableName: archival_task
            indexName: ix_archival_task_status_created
            columns:
              - column: { name: status }
              - column: { name: created_at }
        - sql:
            sql: >
              ALTER TABLE archival_task ADD CONSTRAINT ck_archival_task_status
              CHECK (status IN ('PENDING', 'FAILED'))

  - changeSet:
      id: 001-used-coupons
      author: kupony
      changes:
        - createTable:
            tableName: used_coupons
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_used_coupons } }
              - column: { name: code, type: varchar(32), constraints: { nullable: false } }
              - column: { name: normalized_code, type: varchar(32), constraints: { nullable: false } }
              - column: { name: country, type: varchar(2), constraints: { nullable: false } }
              - column: { name: max_uses, type: int, constraints: { nullable: false } }
              - column: { name: used_count, type: int, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: archived_at, type: timestamp with time zone, constraints: { nullable: false } }
        - createIndex:
            tableName: used_coupons
            indexName: ix_used_coupons_normalized_code
            columns:
              - column: { name: normalized_code }

  - changeSet:
      id: 001-archived-redemptions
      author: kupony
      changes:
        - createTable:
            tableName: archived_redemptions
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_archived_redemptions } }
              - column: { name: coupon_id, type: uuid, constraints: { nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: ip, type: varchar(45), constraints: { nullable: false } }
              - column: { name: country, type: varchar(2), constraints: { nullable: false } }
              - column: { name: redeemed_at, type: timestamp with time zone, constraints: { nullable: false } }
        - createIndex:
            tableName: archived_redemptions
            indexName: ix_archived_redemptions_coupon
            columns:
              - column: { name: coupon_id }
