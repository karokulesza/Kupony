services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kupony
      POSTGRES_USER: kupony
      POSTGRES_PASSWORD: kupony
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kupony -d kupony"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kupony
      SPRING_DATASOURCE_USERNAME: kupony
      SPRING_DATASOURCE_PASSWORD: kupony
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
